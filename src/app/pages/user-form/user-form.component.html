<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form">
  <mat-form-field appearance="fill">
    <mat-label>Nome</mat-label>
    <input matInput formControlName="nome" />
    <mat-error *ngIf="userForm.get('nome')?.hasError('required') && userForm.get('nome')?.touched">
      Nome é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" />
    <mat-error *ngIf="userForm.get('email')?.hasError('required') && userForm.get('email')?.touched">
      Email é obrigatório
    </mat-error>
    <mat-error *ngIf="userForm.get('email')?.hasError('email') && userForm.get('email')?.touched">
      Email inválido
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Telefone</mat-label>
    <input matInput formControlName="telefone" />
    <mat-error *ngIf="userForm.get('telefone')?.hasError('required') && userForm.get('telefone')?.touched">
      Telefone é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>CPF</mat-label>
    <input matInput formControlName="cpf" />
    <mat-error *ngIf="userForm.get('cpf')?.hasError('required') && userForm.get('cpf')?.touched">
      CPF é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>CEP</mat-label>
    <input matInput formControlName="cep" />
    <mat-error *ngIf="userForm.get('cep')?.hasError('required') && userForm.get('cep')?.touched">
      CEP é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Rua</mat-label>
    <input matInput formControlName="rua" readonly />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Bairro</mat-label>
    <input matInput formControlName="bairro" readonly />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Cidade</mat-label>
    <input matInput formControlName="cidade" readonly />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Estado</mat-label>
    <input matInput formControlName="estado" readonly />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">Salvar Usuário</button>
</form>
